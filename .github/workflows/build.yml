name: Build

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: arc-runner-build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        # Provides a `yarn` binary (classic v1, the corepack default with no
        # packageManager field) on the runner.
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        # Runs mocha under c8 coverage, then eslint.
        run: yarn ci-test
